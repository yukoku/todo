<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>TODO</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>TODO</h1>
        <p id="today" class="today"></p>
      </header>

      <section class="card" aria-label="タスク">
        <div class="composer">
          <input id="toggle-all" class="checkbox toggle-all" type="checkbox" disabled>
          <form id="new-todo-form" class="new-todo-form">
            <input
              id="new-todo"
              class="new-todo"
              type="text"
              placeholder="やることを入力…"
              aria-label="新しいタスク"
              autocomplete="off"
              maxlength="200"
              autofocus
            >
            <button class="add-button" type="submit">追加</button>
          </form>
        </div>

        <ul id="todo-list" class="todo-list"></ul>
        <p id="empty-message" class="empty-message"></p>

        <footer id="footer" class="app-footer" hidden>
          <span id="todo-count"></span>
          <nav aria-label="表示の絞り込み">
            <ul class="filters">
              <li><a href="#/" data-filter="all">すべて</a></li>
              <li><a href="#/active" data-filter="active">未完了</a></li>
              <li><a href="#/completed" data-filter="completed">完了済み</a></li>
            </ul>
          </nav>
          <button id="clear-completed" class="clear-completed" type="button" hidden>完了済みを削除</button>
        </footer>
      </section>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <input class="checkbox" type="checkbox" data-role="toggle">
        <span class="todo-title" data-role="title"></span>
        <input class="edit-input" type="text" data-role="edit-input" aria-label="タスク名を編集" maxlength="200">
        <div class="item-actions">
          <button class="icon-button" type="button" data-role="edit" title="編集">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </button>
          <button class="icon-button danger" type="button" data-role="destroy" title="削除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18" />
              <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
              <path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            </svg>
          </button>
        </div>
      </li>
    </template>
  </body>
</html>
